modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
issueTrackerURL="https://github.com/yungnickyoung/Ribbits/issues"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''
logoFile="logo.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/ribbits"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
versionRange="[1.0.0,)"
type = "required"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yungsapi"
versionRange = "[1.0.0,)"
type="required"
ordering="NONE"
side="BOTH"

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"
